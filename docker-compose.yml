version: '3.8'

services:
  # Ollama - Local AI
  ollama:
    image: ollama/ollama:latest
    container_name: urban-nuke-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - dev-network

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: urban-nuke-db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dev-network

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: urban-nuke-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - dev-network

  # Dev Container
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: urban-nuke-dev
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=postgresql://devuser:devpass@postgres:5432/devdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - postgres
      - redis
    networks:
      - dev-network
    command: sleep infinity

volumes:
  ollama-data:
  postgres-data:
  redis-data:

networks:
  dev-network:
    driver: bridge
